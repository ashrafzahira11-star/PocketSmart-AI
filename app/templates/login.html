{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Login
        </h1>


        {% if error %}

        <div class="alert">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="post"
            action="/login"
            class="form"
        >

            <label>

                Username

                <input
                    name="username"
                    required
                    minlength="3"
                >

            </label>


            <label>

                Password

                <input
                    name="password"
                    type="password"
                    required
                    minlength="6"
                >

            </label>


            <button
                class="button primary full"
            >
                Login
            </button>

        </form>


        <p class="muted">

            No account?

            <a href="/register">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}
