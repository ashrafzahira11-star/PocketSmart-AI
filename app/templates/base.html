<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="navbar">

    <a
        class="brand"
        href="/"
    >
        PocketSmart
        <span>AI</span>
    </a>

    <nav>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <form
                method="post"
                action="/logout"
                class="inline"
            >

                <button class="link-button">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="nav-cta"
                href="/register"
            >
                Get Started
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<script src="/static/js/app.js"></script>


{% block scripts %}
{% endblock %}

</body>

</html>
